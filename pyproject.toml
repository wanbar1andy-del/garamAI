[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garam"
version = "0.2.0"
description = "Garam Algorithmic Trading System V2"
authors = [
  { name = "Garam Team" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.20.0",
    "requests",
    "pyyaml",
    "PyQt5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools.packages.find]
include = ["garam_core*", "pipeline*", "core*", "scripts*"]
