# Champion Rule v3.0 Weighted 95% Exposure (Top 200)
# - 유니버스: Top 200 (More Stable)
# - 포지션: 3~5개
# - 비중: Score 기반 가중치 (score_power)
# - 노출: 95%

universe:
  file: "GARAM_Data/real_universe_200.csv"

scores:
  file: "GARAM_Data/real_scores_2024.csv"
  score_id: "momentum_6m" # A1 기본 점수 (Multi-Alpha는 코드에서 Aggregator로 합성)

selection:
  gate_score: 0.0
  max_positions: 5 # 보유 종목 상한 (최대 5개)
  min_candidates: 5 # 최소 5개는 항상 후보로
  challenger_pool_size: 2 # 챔피언 외에 0~2개 챌린저

allocation:
  scheme: "score_power" # [NEW] 점수 기반 비중 배분
  target_gross_exposure: 0.95
  champion_budget: 0.90 # 95% 중 90%는 챔피언
  score_floor: 0.0 # 점수 하한
  score_gamma: 1.5 # 가중치 지수 (클수록 상위 종목 집중)
  tilt_threshold: 0.00
  tilt_fraction: 0.00

exploration:
  enabled: true
  exploration_fraction: 0.05 # 5%는 챌린저 탐색용
  switch_threshold: 0.10 # 챌린저 점수가 최악 챔피언보다 0.10↑면 스왑

execution:
  rebalance_frequency: "daily"
  max_turnover_per_day: 1.0
  min_trade_size_pct: 0.02
  morning_stop_loss: false
  afternoon_stop_loss: false
  blacklist_days: 0

capital:
  initial_equity: 100000000

# Regime Overrides (Same as V3)
regime_overrides:
  R1_STRONG_UP:
    max_positions: 2
    min_candidates: 3
    champion_budget: 1.00
    exploration_fraction: 0.00

  R2_UP:
    max_positions: 2
    min_candidates: 3
    champion_budget: 1.00
    exploration_fraction: 0.00

  R3_UP_BOX:
    max_positions: 5
    min_candidates: 6
    champion_budget: 0.90
    exploration_fraction: 0.10

  R4_BOX:
    max_positions: 5
    min_candidates: 6
    champion_budget: 0.90
    exploration_fraction: 0.10

  R5_DOWN_BOX:
    max_positions: 5
    min_candidates: 6
    champion_budget: 0.90
    exploration_fraction: 0.10

  R6_DOWN:
    max_positions: 1
    min_candidates: 1
    champion_budget: 0.50
    exploration_fraction: 0.00

  R7_CRASH:
    max_positions: 0
    min_candidates: 0
    champion_budget: 0.00
    exploration_fraction: 0.00
