# Pure v3 Playbook
# Forces M_ATTACK_V3_SUHV for all regimes

regimes:
  R1_STRONG_UP_BREAKOUT:
    module: M_ATTACK_V3_SUHV
    intensity_step: 1.0
  R2_STRONG_UP_GRIND:
    module: M_ATTACK_V3_SUHV
    intensity_step: 1.0
  R3_SIDEWAYS_RANGE_LOWVOL:
    module: M_ATTACK_V3_SUHV
    intensity_step: 1.0
  R4_SIDEWAYS_RANGE_HIGHVOL:
    module: M_ATTACK_V3_SUHV
    intensity_step: 1.0
  R5_WEAK_DOWN_DRIFT:
    module: M_ATTACK_V3_SUHV
    intensity_step: 1.0
  R6_STRONG_DOWN_CRASH:
    module: M_ATTACK_V3_SUHV
    intensity_step: 1.0
  R7_EVENT_RISK_OFF:
    module: M_ATTACK_V3_SUHV
    intensity_step: 1.0

modules:
  M_ATTACK_V3_SUHV:
    base:
      mode: "Attack"
      time_stop_min: 120
      target_R: 3.0
      stop_R: 1.2
      risk_pct_base: 0.015
      max_positions: 5
      scale_in_steps: 3
      scale_out_steps: 2
