# Alpha A2 Frozen Spec v1.0.0
# Date: 2026-01-01
# Strategy: Volatility Breakout (5m)

strategy:
  name: "A2_VolBreakout"
  version: "1.0.0"
  timeframe: "1m"
  resample_interval: "5min"

universe:
  top_n: 100
  min_price: 1000
  exclude_etf: true
  exclude_holding: true

factors:
  lookback_window: 100
  bb_window: 20
  bb_std: 2.0
  breakout_window: 20
  vol_ma_window: 20
  
weights:
  compression: 0.45
  breakout: 0.35
  volume: 0.20

gates:
  score_comp_min: -0.2
  breakout_min: 0.0015 # 0.15%
  vol_ratio_min: 1.3

risk:
  stop_loss_pct: 0.012      # 1.2% Hard Stop
  trailing_stop_pct: 0.010  # 1.0% Trailing
  time_stop_minutes: 30     # 30m Time Stop
  time_stop_threshold: 0.002 # Must be > 0.2%
  daily_kill_pct: 0.02      # -2% Daily Equity Kill
  
execution:
  fee_bps: 0.015            # 0.015%
  slippage_bps: 0.035       # 0.035%
  capital: 10000000         # Paper Capital
