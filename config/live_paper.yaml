# config/live_paper.yaml
# Phase 30-3: Paper Live Configuration
# Inherits Strategy/Risk from Alpha A2 v1.0.0

strategy:
  name: "A2_VolBreakout"
  version: "1.0.0"
  timeframe: "1m"
  resample_interval: "5m" # Engine handles TICK -> BAR (1m) -> Resampler (5m)

universe:
  top_n: 100
  min_price: 1000
  exclude_etf: true
  exclude_holding: true

factors:
  lookback_window: 100
  bb_window: 20
  bb_std: 2.0
  breakout_window: 20
  vol_ma_window: 20

weights:
  compression: 0.45
  breakout: 0.35
  volume: 0.20

gates:
  score_comp_min: -0.2
  breakout_min: 0.0015
  vol_ratio_min: 1.3

risk:
  stop_loss_pct: 0.012
  trailing_stop_pct: 0.010
  time_stop_minutes: 30
  time_stop_threshold: 0.002
  daily_kill_pct: 0.02

execution:
  fee_bps: 0.015
  slippage_bps: 0.035
  capital: 100000000 # 100M KRW Paper Capital

# Realtime Source
live_source_path: "C:/garam/garam/feed_live.jsonl"
watermark_sec: 3.0
mode: live
shadow_test_mode: false
