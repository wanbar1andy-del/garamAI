# Turbo Profile (Aggressive Case)
# - Universe: Top 300
# - Leverage: 2.4x (Adaptive)
# - Strategy: Max Profit

universe:
  file: "GARAM_Data/real_universe_300.csv"

scores:
  file: "GARAM_Data/real_scores_2024.csv"
  score_id: "momentum_6m"

selection:
  gate_score: 0.0
  max_positions: 5
  min_candidates: 5
  challenger_pool_size: 2

allocation:
  scheme: "score_power"
  target_gross_exposure: 2.4 # Turbo Base
  champion_budget: 0.90
  score_floor: 0.0
  score_gamma: 2.0 # Aggressive concentration

exploration:
  enabled: true
  exploration_fraction: 0.05
  switch_threshold: 0.10

execution:
  rebalance_frequency: "daily"
  max_turnover_per_day: 1.0
  min_trade_size_pct: 0.02

capital:
  initial_equity: 100000000

regime_overrides:
  # Turbo Logic: Scale leverage by regime (Modified for Safety)
  R1_STRONG_UP: { target_gross_exposure: 2.4, max_positions: 2 }
  R2_UP: { target_gross_exposure: 1.5, max_positions: 3 } # Reduced from 2.0
  R3_UP_BOX: { target_gross_exposure: 1.2, max_positions: 5 } # Reduced from 1.5
  R4_BOX: { target_gross_exposure: 1.2, max_positions: 5 }
  R5_DOWN_BOX: { target_gross_exposure: 1.0, max_positions: 5 }
  R6_DOWN: { target_gross_exposure: 0.5, max_positions: 5 }
  R7_CRASH: { target_gross_exposure: 0.0 }
