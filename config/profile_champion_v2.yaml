# Champion Profile v2 (Profit-First)
# Objective: CAGR +30%, MDD -60%
# Philosophy: Winner Takes All, Smart Swing

layer1:
  score_engine: "Regime + Edge"
  regime_logic:
    R1_STRONG_UP: "0.8 ~ 1.0"
    R2_GRIND_UP: "0.5 ~ 0.7"
    R3_CHOP: "0.0 ~ 0.14"
    R4_DOWN: 0.0
    R5_STRONG_DOWN: 0.0
    R6_EVENT: 0.0
    R7_UNKNOWN: 0.0

layer2:
  allocation: "Winner Takes All"
  t_gate: 0.15
  max_positions: 3

layer3:
  execution: "DGEFinalStrategy"
  smart_swing:
    hold_condition: "Score >= 0.5 AND PnL >= 0 AND Regime != Ban"
    stop_loss_pct: 0.08
    tight_stop_limit: 0.05

backtest:
  success_criteria:
    cagr_min: 0.30
    mdd_limit: -0.60
