strategy:
  name: "Alpha_A2_VolBreakout"
  version: "1.0.1"
  logic:
    description: "Volatility Breakout (5m)"
    timeframe: "5m"

factors:
  lookback_window: 100
  bb_window: 20
  breakout_window: 20
  vol_ma_window: 20

gates:
  score_comp_min: -999.0 # Use Hardcoded w_z < 0
  breakout_min: 0.0015 # > 0.15%
  vol_ratio_min: 1.3 # > 1.3x

weights:
  compression: 0.45
  breakout: 0.35
  volume: 0.20

execution:
  capital: 10000000
  target_size: 0.99 # All-in (minus fee buffer)
  slippage_bps: 20 # 0.2%
  fee_bps: 1.5 # 0.015%

risk:
  stop_loss: 0.012 # -1.2%
  trailing_stop: 0.010 # -1.0%
  time_stop_min: 30
  time_stop_threshold: 0.002 # +0.2%
  daily_kill_switch: -0.02 # -2.0%
